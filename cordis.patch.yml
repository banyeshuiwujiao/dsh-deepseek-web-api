# ============================================================================
# dsh-deepseek-web-api —— 把 deepseek-web-api 网页私有 API 反代接入模型选择器
# ============================================================================
# 注意：仅作为 provider 路由接入模型选择器，不加入工具列表。
#
# 本文件是**本插件自带的 bundle patch**（package.json 的
# dsh.bundle.patch 指向它）。它随插件一起被 DSH 读取：
#
#   · 启用/停用 = profile 的 dsh.profile.bundles 里有没有 dsh-deepseek-web-api
#     （插件页「已安装插件」右侧的开关改的就是那个列表）；
#   · 本文件里的 config 是插件的**可移植默认值**。profile 的
#     cordis.patch.yml 可以按 id 覆盖它（覆盖是整块替换，必须列全所有键）。
#
# 接入步骤：
#   1. 执行 .\install.ps1（把本机后端目录写进指针 ~/.dsh/deepseek-web-api.json，
#      并校验 ~/.dsh/profiles/desktop/node_modules/dsh-deepseek-web-api 是 junction）
#   2. 确认 profile 的 dsh.profile.bundles 里列了 dsh-deepseek-web-api
#      （dsh plugin --profile desktop add link:<本目录> 会自动加）
#   3. 重启 DeepSeek Harness.exe
#
# 停用本插件不会留下悬空的 provider 行：整段 insert 随 bundle 一起退出组合。
# ============================================================================

- insert:
    - id: dsh-deepseek-web-api-provider
      name: dsh-deepseek-web-api/provider
      config:
        # 只允许回环：反代带着网页登录态，绑到 0.0.0.0 等于把账号交给整个网络。
        baseUrl: 'http://127.0.0.1:8787'
        # 后端目录故意留空——按 配置 serverDir → 环境变量 DSH_DEEPSEEK_WEB_API_DIR
        # → 指针 ~/.dsh/deepseek-web-api.json → 插件同级 → home 常见位置 依次解析。
        # 需要指明时写绝对路径或 ~ 开头的路径：
        # serverDir: '~/DeepSeek_Harness/git-repo/deepseek-web-api'
        autoStart: true
        startTimeoutMs: 60000
        # 2026-10-21 实测：128K 只是自报值，反代与上游都没有这道闸门。
        # 上游真实窗口（逐档打点，随机暗号埋在 2%/25%/50%/75%/98%，模型 deepseek-v4-flash）：
        #   1,850,168 中文字符 = 上游累计 957,921 token 仍 5/5 命中；1,900,163 字符起变成静默空回合。
        #   即真实上限 ≈ 1M token，与 V4 官方规格一致；这批中文换算比稳定在 0.518 token/字。
        # 为什么是 560000：这个值不是模型能力，而是内核压缩线的输入。dsh-compaction-basic 的公式是
        #   threshold = min(0.8W, W - defaultMaxTokens - 65536)，而它的 tokenMeter 按「4 字符≈1 token」估算，
        #   对中文只有一半准。560000 → 阈值 448,000 估算 token = 179.2 万字符 = 真实约 92.8 万 token，
        #   在实测上限 95.8 万之内并留约 3% 余量。576000 是吃满的一档（真实约 95.5 万，余量只剩 0.3%）；
        #   640000 会让压缩到真实约 106 万 token 才动手，等于永远赶不上静默空回合。
        #   中文会话算出来的安全上界是 577,900，512000 是留 11% 余量的保守档。
        #   旧的 128000 才是"上下文很小就被压掉"的真因：阈值只有 29,696 估算 token ≈ 6.2 万真实 token。
        #   换算法与复算工具见插件 README 与反代 docs/api.md 的「Measured context ceiling」。
        maxContextWindow: 560000
        # 上游网页端不接受 max_tokens，这个值只是向 DSH 申报"单轮最多可能吐多少 token"，
        # 内核按它预留上下文水位；实测单轮可产出 6 万字符（约 2 万 token），8192 会让压缩过于乐观。
        defaultMaxTokens: 32768
        # 0 = 不裁剪工具描述（反代把定义原样注入提示词，裁剪等于让模型看不到）。
        toolDescriptionMaxChars: 0
        # clean：工具回合也实时下发深度思考增量；text：沿用 JSON 文本工具协议（两种协议后端都能解析）。
        toolReasoning: 'clean'
        tools: 'text'
        # live：工具回合正文也走协议闸门实时出字（只扣不回，标记不外泄）。代价是被判无效的那一轮会重试，
        # 重来的答案只追加不上屏，屏幕文字可能与入库消息不同；要最保真的转写就把这里改回 'buffered'。
        streamContent: 'live'
        # /health 结果缓存：一次 13 步的会话不必每步都探活一次。0 = 每次都探活。
        healthTtlMs: 30000
        # 上游连续无数据的容忍上限，超时按可重试的 TIMEOUT 中止。0 = 不设上限。
        streamIdleTimeoutMs: 120000
        # 后端子进程输出落盘（超过 2MB 轮转 .1），便于事后取证；留空只留在内存尾部 200 行。
        logFile: '~/.dsh/logs/deepseek-web-api.log'
        # 托管（默认）：stdio 走管道，插件可 tail 日志并在 dispose 时按进程树回收（含后端起的 Chrome）；
        # 副作用是拉起者被强杀时后端会因 EPIPE 自行退出。detach: true 则相反——后端独立存活。
        detach: false
        killTreeOnDispose: true
        # 子进程环境默认白名单（OS 必需项 + DS_*）。确实还要透传别的变量时在这里点名变量名。
        passEnvKeys: []
        # 能力契约：后端 /health 必须自述这些能力，缺了就拒绝复用（不静默退回旧故障）。
        # 留空 = 用插件内置清单（dsml-tool-calls / protocol-switches / include-usage /
        # health-self-description）。明知后端旧还想跑，把 strictBackend 设为 false。
        strictBackend: true
        requiredCapabilities: []
        minBackendVersion: ''
