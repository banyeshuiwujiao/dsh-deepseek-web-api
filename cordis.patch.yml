# ============================================================================
# dsh-deepseek-web-api —— 把 deepseek-web-api 网页私有 API 反代接入模型选择器
# ============================================================================
# 注意：仅作为 provider 路由接入模型选择器，不加入工具列表。
#
# 接入步骤：
#   1. 执行 .\install.ps1 同步插件到 ~/.dsh/profiles/desktop/node_modules/dsh-deepseek-web-api
#   2. 把下方 insert 块合进权威源 dsh-client-config\profiles\desktop\cordis.patch.yml
#   3. 执行 python scripts\sync-profiles.py --profile desktop
#   4. 重启 DeepSeek Harness.exe
# ============================================================================

- insert:
    - id: dsh-deepseek-web-api-provider
      name: dsh-deepseek-web-api/provider
      config:
        baseUrl: 'http://127.0.0.1:8787'
        serverDir: 'C:\Users\Admin\DeepSeek_Harness\git-repo\deepseek-web-api'
        autoStart: true
        startTimeoutMs: 60000
        maxContextWindow: 128000
        # 上游网页端不接受 max_tokens，这个值只是向 DSH 申报单轮输出预留（内核 reservedCompletionTokens）。
        defaultMaxTokens: 32768
        # 0 = 不裁剪工具描述；>0 时按字符预算裁剪并加省略号。
        toolDescriptionMaxChars: 0
        # 拉起后端时注入的环境开关；clean 让深度思考实时流式，tools 选择提示词里的工具协议形态。
        toolReasoning: 'clean'
        tools: 'text'
        # /health 结果缓存：一次 13 步的会话不必每步都探活一次。0 = 每次都探活。
        healthTtlMs: 30000
        # 上游连续无数据的容忍上限，超时按可重试的 TIMEOUT 中止。0 = 不设上限。
        streamIdleTimeoutMs: 120000
        # 填路径则把后端子进程输出落盘（超过 2MB 轮转 .1），便于事后取证；留空只留在内存尾部 20 行。
        logFile: ''
        # 托管（默认）：stdio 走管道，插件可 tail 日志并在 dispose 时按进程树回收（含后端起的 Chrome）；
        # 副作用是拉起者被强杀时后端会因 EPIPE 自行退出。detach: true 则相反——后端独立存活。
        detach: false
        killTreeOnDispose: true
